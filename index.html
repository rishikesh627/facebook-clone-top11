<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Facebook - log in or sign up</title>
  </head>
  <body class="bg-gray-100">
    <div class="container mt-48 flex mx-auto items-center justify-center">
      <div class="left w-2/3 mx-4">
        <img src="logo.svg" class="w-80" alt="Facebook logo" />
        <p class="text-3xl mx-8">
          Facebook helps you connect and share with the people in your life.
        </p>
      </div>

      <div
        class="relative right flex flex-col bg-white p-8 text-lg rounded-xl w-2/5"
      >
        <input
          class="px-4 h-12 my-3 outline-blue-500 border border-1 rounded-lg border-gray-200"
          type="text"
          placeholder="Email Address or phone number "
        />
        <input
          class="px-4 h-12 my-3 outline-blue-500 border border-1 rounded-lg border-gray-200"
          type="password"
          placeholder="password"
        />
        <button
          class="btn cursor-pointer bg-blue-600 hover:bg-blue-700 text-white my-3 py-3 rounded-md font-bold"
        >
          Log In
        </button>
        <span
          class="text-blue-600 text-center text-sm my-3 cursor-pointer hover:underline"
          >Forgotten password?</span
        >
        <hr />
        <button
          class="btn cursor-pointer hover:bg-green-700 bg-green-600 text-white my-3 py-3 rounded-md font-bold w-fit px-4 mx-auto"
        >
          Create New Account
        </button>
        <span class="absolute -bottom-10 text-sm"
          ><span class="font-bold hover:underline cursor-pointer"
            >Create a Page</span
          >
          for a celebrity, brand or business.</span
        >
      </div>
    </div>
  </body>
</html>
